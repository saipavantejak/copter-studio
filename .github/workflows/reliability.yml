name: Software reliability checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  software-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Independently check recorded study metrics and generated claims
        run: node scripts/learning/verify-study-independent.mjs
      - name: Check regenerated numeric inventory
        run: python scripts/learning/check-inventory.py
      - name: Prove numeric claim drift is rejected
        run: python scripts/learning/check-claim-drift.py
      - name: Replay frozen final stage twice in clean worktrees
        run: python scripts/learning/check-final-determinism.py
      - name: Independently check recorded public-flight diagnostic
        run: |
          python scripts/physics/verify-flight.py
          python scripts/physics/render-report.py --check
      - run: npm run lint
      - run: npm run type-check:server
      - run: npm test
      - run: npm run build
      - name: Ensure server and mistakenly VITE-prefixed API keys stay out of client output
        run: python scripts/security/check-client-bundle.py --check
      - name: Check recorded security claims
        run: python scripts/security/render-report.py --check
      - name: Check scoped stop report against retained evidence
        run: python scripts/product/render-stop-report.py --check
      - run: npm run ci:reliability
      - run: npm run ci:adversarial
