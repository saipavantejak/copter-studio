name: Software reliability checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  software-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Independently check recorded study metrics and generated claims
        run: node scripts/learning/verify-study-independent.mjs
      - run: npm run lint
      - run: npm run type-check:server
      - run: npm test
      - run: npm run build
      - run: npm run ci:reliability
      - run: npm run ci:adversarial
